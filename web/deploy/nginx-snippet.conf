# wadamesh in the browser: the location block for web/dist on our host.
#
# The build runs the UI's background tasks on WebAssembly threads (SharedArrayBuffer),
# which browsers only enable on a cross-origin isolated page. Without these two headers
# the page shows "This page is not cross-origin isolated" and does not start.
#   Cross-Origin-Opener-Policy: same-origin
#   Cross-Origin-Embedder-Policy: require-corp
# Every resource the page loads must then be same-origin or CORS/CORP-enabled (Google
# Fonts is loaded with crossorigin="anonymous" and answers with CORS).
#
# nginx: add_header in a nested location REPLACES the outer ones, so each block repeats
# them. "always" keeps them on 304/404 too. Behind Cloudflare these pass through as-is.
#
# Files: index.html, app.js, app.css, wadamesh.js, wadamesh.wasm (+ .gz / .br next to
# them, written by web/build.sh web). The page asks for wadamesh.js/.wasm with
# ?v=<build hash>, so they may be cached long; index.html must revalidate.

location /web/ {
    root /var/www/wadamesh;                  # adjust: web/dist is rsynced to <root>/web/
    index index.html;

    add_header Cross-Origin-Opener-Policy  "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;

    gzip_static on;          # serves wadamesh.wasm.gz when the client accepts gzip
    # brotli_static on;      # with ngx_brotli: serves the .br files

    location ~* \.(wasm|js|css)$ {
        types { application/wasm wasm; text/javascript js; text/css css; }
        add_header Cross-Origin-Opener-Policy  "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;   # requested with ?v=<hash>
        gzip_static on;
        # brotli_static on;
    }
}

# Map tiles, same-origin (web/compat/wada_http.h): the page asks for tiles/<z>/<x>/<y>.jpg
# next to itself (and tiles/elev?locations=... for line of sight), and this proxies them
# to the firmware's tile server (DEFAULT_TILE_SERVER, src/helpers/esp32/TouchPrefsStore.cpp)
# with an identifying User-Agent, as OSM's tile policy asks. Same-origin replies need no
# CORS and satisfy COEP. The proxy_cache zone goes in the http {} block:
#   proxy_cache_path /var/cache/nginx/wada-tiles levels=1:2 keys_zone=wada_tiles:16m
#                    max_size=2g inactive=30d use_temp_path=off;
location ^~ /web/tiles/ {
    # only z/x/y tiles (optionally a style folder) and the elevation query
    location ~ "^/web/tiles/((?:[a-z]+/)?[0-9]{1,2}/[0-9]{1,7}/[0-9]{1,7}\.(?:jpg|png)|elev)$" {
        set $wada_tile_upstream http://tiles.wadamesh.com;   # a variable: re-resolved via the resolver
        resolver 1.1.1.1 valid=300s;
        rewrite ^/web/tiles/(.*)$ /$1 break;
        proxy_pass $wada_tile_upstream;
        proxy_set_header Host tiles.wadamesh.com;
        proxy_set_header User-Agent "wadamesh-web (https://github.com/ALLFATHER-BV/wadamesh)";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_cache wada_tiles;
        proxy_cache_valid 200 14d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=1209600" always;
    }
    return 404;
}

# The Store, same-origin (web/compat/wada_http.h): the page asks for fw/apps/apps.json,
# fw/apps/<id>/<ver>/<file> and fw/apps/lang/<ver>/<code>.lang next to itself; this
# proxies exactly those to http://firmware.wadamesh.com/apps/. The rest of that server
# (update check, OTA images, reports) is not reachable from the page, on purpose.
location ^~ /web/fw/apps/ {
    location ~ "^/web/fw/apps/(apps\.json|langs\.json|[A-Za-z0-9_-]{1,20}/[0-9][0-9.]{0,7}/[A-Za-z0-9_-][A-Za-z0-9._-]{0,39}|lang/([0-9][0-9.]{0,7}/)?[a-z]{2}(-[a-z]{2})?\.lang)$" {
        set $wada_store_upstream http://firmware.wadamesh.com;
        resolver 1.1.1.1 valid=300s;
        rewrite ^/web/fw/(apps/.*)$ /$1 break;
        proxy_pass $wada_store_upstream;
        proxy_set_header Host firmware.wadamesh.com;
        proxy_set_header User-Agent "wadamesh-web (https://github.com/ALLFATHER-BV/wadamesh)";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # catalogs change with each release; a version folder never does
        set $wada_store_cache "public, max-age=604800";
        if ($uri ~ "/(apps|langs)\.json$") { set $wada_store_cache "no-cache"; }
        add_header Cache-Control $wada_store_cache always;
    }
    return 404;
}
