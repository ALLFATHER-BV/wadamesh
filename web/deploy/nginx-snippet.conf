# wadamesh in the browser: the location block for web/dist on our host.
#
# The build runs the UI's background tasks on WebAssembly threads (SharedArrayBuffer),
# which browsers only enable on a cross-origin isolated page. Without these two headers
# the page shows "This page is not cross-origin isolated" and does not start.
#   Cross-Origin-Opener-Policy: same-origin
#   Cross-Origin-Embedder-Policy: require-corp
# Every resource the page loads must then be same-origin or CORS/CORP-enabled (Google
# Fonts is loaded with crossorigin="anonymous" and answers with CORS).
#
# nginx: add_header in a nested location REPLACES the outer ones, so each block repeats
# them. "always" keeps them on 304/404 too. Behind Cloudflare these pass through as-is.
#
# Files: index.html, app.js, app.css, wadamesh.js, wadamesh.wasm (+ .gz / .br next to
# them, written by web/build.sh web). The page asks for wadamesh.js/.wasm with
# ?v=<build hash>, so they may be cached long; index.html must revalidate.

location /web/ {
    root /var/www/wadamesh;                  # adjust: web/dist is rsynced to <root>/web/
    index index.html;

    add_header Cross-Origin-Opener-Policy  "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;

    gzip_static on;          # serves wadamesh.wasm.gz when the client accepts gzip
    # brotli_static on;      # with ngx_brotli: serves the .br files

    location ~* \.(wasm|js|css)$ {
        types { application/wasm wasm; text/javascript js; text/css css; }
        add_header Cross-Origin-Opener-Policy  "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;   # requested with ?v=<hash>
        gzip_static on;
        # brotli_static on;
    }
}
