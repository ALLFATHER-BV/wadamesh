<script>
/*#include auth.js*/
var WS,dec=new TextDecoder(),curTab='chats',chat=null,threads=[],contacts=[],channels=[];
var mentionNames=[],mentionMatches=[],mentionSel=0,mentionReq=0;
var csort=0,cfilter=0,csearchq='',self={la:0,lo:0},lpAt=0,useMi=0,discCount=0;
var SORTL=['Recent','A-Z','Distance'],FILTL=['All','Repeaters','Peers','Favorites','Located','Direct','Rooms'];
function age(ts){if(!ts||ts<1000000000)return'';var s=Math.floor(Date.now()/1000)-ts;if(s<0)s=0;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<604800)return Math.floor(s/86400)+'d';return Math.floor(s/604800)+'w'}
function fmtDist(km){if(km>=1e17)return'';if(useMi){var mi=km*0.621371;return (mi<10?mi.toFixed(1):Math.round(mi))+' mi'}return (km<10?km.toFixed(1):Math.round(km))+' km'}
function E(i){return document.getElementById(i)}
function each(l,f){Array.prototype.forEach.call(l,f)}
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
function fmt(t){if(!t||t<1000000000)return'';var d=new Date(t*1000);return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function fmtDate(t){return (t>1000000000)?new Date(t*1000).toLocaleString():'--'}
function stat(t,k){var el=E('dot');el.style.color=(k=='ok')?'var(--acc)':((k=='err')?'var(--danger)':'var(--faint)');el.title=t}
function wsSend(s){if(WS&&WS.readyState==1){WS.send(s);return true}return false}
function cById(i){for(var k=0;k<contacts.length;k++)if(contacts[k].i==i)return contacts[k];return null}
function mentionHide(){mentionMatches=[];mentionSel=0;var b=E('mnames');b.classList.remove('on');b.innerHTML=''}
function mentionToken(){var i=E('cvi'),v=i.value,p=i.selectionStart;if(p==null)return null;var a=p,found=false,punc=',.;:!?()[]{}<>';
 while(a>0){var c=v.charAt(a-1);if(c=='@'){a--;found=true;break}if(' \n\t\r'.indexOf(c)>=0||punc.indexOf(c)>=0)return null;a--}
 if(!found||(a>0&&' \n\t\r'.indexOf(v.charAt(a-1))<0))return null;var end=p;while(end<v.length&&' \n\t\r'.indexOf(v.charAt(end))<0&&punc.indexOf(v.charAt(end))<0)end++;return{a:a,p:p,e:end,q:v.slice(a+1,p)}}
function mentionPaint(){var b=E('mnames');b.innerHTML='';if(!mentionMatches.length){mentionHide();return}
 mentionMatches.forEach(function(n,idx){var x=document.createElement('button');x.type='button';x.textContent='@'+n;if(idx==mentionSel)x.className='on';x.onmousedown=function(e){e.preventDefault()};x.onclick=function(){mentionPick(n)};b.appendChild(x)});b.classList.add('on')}
function mentionRefresh(){var t=mentionToken();if(!t){mentionHide();return}var q=t.q.toLowerCase();mentionMatches=mentionNames.filter(function(n){return n.toLowerCase().indexOf(q)==0}).slice(0,6);if(mentionSel>=mentionMatches.length)mentionSel=0;mentionPaint()}
function mentionPick(n){var i=E('cvi'),t=mentionToken();if(!t)return mentionHide();var v=i.value,sp=t.e==v.length?' ':'';i.value=v.slice(0,t.a)+'@'+n+sp+v.slice(t.e);var p=t.a+1+n.length+sp.length;mentionHide();i.focus();i.setSelectionRange(p,p)}
function mentionMove(d){if(!mentionMatches.length)return;mentionSel=(mentionSel+d+mentionMatches.length)%mentionMatches.length;mentionPaint()}
function mentionRequest(){if(!chat)return;mentionReq++;wsSend('@mh '+mentionReq)}
function showTab(t){curTab=t;['chats','contacts','term'].forEach(function(x){E('p'+x).style.display=(x==t)?'':'none'});
 each(document.querySelectorAll('#tabs button'),function(b){b.className=(b.getAttribute('data-t')==t)?'on':''});
 if(t=='chats'){if(!chat){closeChat();wsSend('@t')}}else if(t=='contacts'){wsSend('@c')}else if(t=='term'){E('i').focus()}}
function svgSig(l){var b='';for(var i=0;i<4;i++){var h=3+i*3;b+='<rect x='+(i*4)+' y='+(12-h)+' width=3 height='+h+' rx=1 style=fill:'+(i<l?'var(--acc)':'var(--line2)')+' />'}return '<svg width=15 height=12 viewBox="0 0 15 12">'+b+'</svg>'}
function svgWifi(on){var c=on?'var(--acc)':'var(--line2)';return '<svg width=16 height=12 viewBox="0 0 16 12" fill=none style=stroke:'+c+' stroke-width=1.5 stroke-linecap=round><path d="M2.2 4.6a8 8 0 0 1 11.6 0" /><path d="M4.6 7.1a4.6 4.6 0 0 1 6.8 0" /><circle cx=8 cy=9.6 r=0.9 style=fill:'+c+' stroke=none /></svg>'}
function svgBt(){return '<svg width=10 height=14 viewBox="0 0 10 14" fill=none style=stroke:var(--info) stroke-width=1.3 stroke-linejoin=round stroke-linecap=round><path d="M2 4l6 6-3 2.5V1.5l3 2.5-6 6" /></svg>'}
function svgBatt(p,chg){var col=p<=20?'var(--danger)':(p<=50?'var(--warn)':'var(--acc)');var w=Math.max(1,Math.round(p/100*16));var bolt=chg?'<path d="M12 3l-3 4h2l-1 3 3-4h-2z" style=fill:var(--warn) />':'';return '<svg width=27 height=13 viewBox="0 0 27 13"><rect x=0.5 y=2 width=21 height=9 rx=2 fill=none style=stroke:var(--faint) /><rect x=22 y=4.5 width=2.2 height=4 rx=1 style=fill:var(--faint) /><rect x=2 y=3.5 width='+w+' height=6 rx=1 style=fill:'+col+' />'+bolt+'</svg>'}
function renderStatus(d){E('hnm').textContent=d.nm||'';self.la=d.sla||0;self.lo=d.slo||0;useMi=d.mi?1:0;
 var lvl=(d.snr<=-127)?0:(d.snr>=5?4:(d.snr>=0?3:(d.snr>=-7?2:1)));
 E('hsig').innerHTML=svgSig(lvl);E('hwifi').innerHTML=d.wifi?svgWifi(1):'';E('hble').innerHTML=d.ble?svgBt():'';
 E('hbatt').innerHTML=(d.batt<0)?'':(svgBatt(d.batt,d.chg)+'<span class=bpct>'+d.batt+'%</span>');
 E('hclk').textContent=fmt(d.clk);
 var cb=document.querySelector('#tabs [data-t=chats]');if(cb)cb.textContent=d.unr>0?('Chats ('+d.unr+')'):'Chats'}
function closeOv(){E('sheet').classList.remove('on');E('modal').classList.remove('on');E('scrim').classList.remove('on')}
function sheet(title,items){var h='<h4>'+esc(title)+'</h4>';items.forEach(function(it,i){h+='<button class="si '+(it.cls||'')+'" data-i='+i+'>'+esc(it.label)+'</button>'});
 E('sheet').innerHTML=h;each(E('sheet').querySelectorAll('.si'),function(b){b.onclick=function(){var it=items[+b.getAttribute('data-i')];closeOv();if(it.fn)it.fn()}});
 E('sheet').classList.add('on');E('scrim').classList.add('on')}
function modal(title,html){E('mbox').innerHTML='<h3>'+esc(title)+'</h3>'+html+'<button id=mclose>Close</button>';E('modal').classList.add('on');E('scrim').classList.add('on');E('mclose').onclick=closeOv}
function copy(t){try{navigator.clipboard.writeText(t)}catch(_){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}}
function longPress(el,fn){var tmr=null;function s(){tmr=setTimeout(function(){tmr=null;lpAt=Date.now();fn()},480)}function c(){if(tmr){clearTimeout(tmr);tmr=null}}
 el.addEventListener('touchstart',s,{passive:true});el.addEventListener('touchmove',c,{passive:true});el.addEventListener('touchend',c);
 el.addEventListener('mousedown',s);el.addEventListener('mouseup',c);el.addEventListener('mouseleave',c);el.addEventListener('contextmenu',function(e){e.preventDefault();lpAt=Date.now();fn()})}
function clicked(fn){return function(){if(Date.now()-lpAt<650)return;fn()}}
function contactSheet(c){sheet(c.n||'Contact',[
 {label:'Message',fn:function(){if(c.t>=0)wsSend('@m '+c.t);else wsSend('@oc '+c.i)}},
 {label:'Info',fn:function(){wsSend('@ic '+c.i)}},
 {label:'Telemetry',fn:function(){wsSend('@tm '+c.i)}},
 {label:c.fav?'Unfavorite':'Favorite',fn:function(){wsSend('@fv '+c.i)}},
 {label:'Reset path',fn:function(){wsSend('@pr '+c.i)}},
 {label:c.ign?'Unblock':'Block',fn:function(){wsSend('@bk '+c.i)}},
 {label:'Delete',cls:'dng',fn:function(){if(confirm('Delete '+(c.n||'contact')+'?'))wsSend('@xc '+c.i)}}])}

 {label:'Mark as read',fn:function(){wsSend('@r '+t.i)}},

 {label:'Delete chat',cls:'dng',fn:function(){if(confirm('Delete this chat?'))wsSend('@xt '+t.i)}}])}
function msgSheet(m){var it=[];if(chat&&chat.ch&&!m.o&&m.s)it.push({label:'Reply',fn:function(){msgReply(m)}});
 it.push({label:'Copy',fn:function(){copy(m.x)}},{label:'Info',fn:function(){msgInfo(m)}});sheet('Message',it)}
function msgReply(m){var i=E('cvi'),t='@['+m.s+'] ';if(i.value.indexOf(t)!=0)i.value=(t+i.value.replace(/^\s+/,'')).slice(0,160);i.focus();var p=i.value.length;i.setSelectionRange(p,p)}
function msgInfo(m){var pl=(m.pl==255)?'Direct':(m.pl+' hop'+(m.pl==1?'':'s'));

function showContactInfo(d){var type=d.rp?'Repeater':(d.rm?'Room server':'Contact');var pl=(d.pl<0)?'Unknown':(d.pl==0?'Direct':(d.pl+' hop'+(d.pl==1?'':'s')));
