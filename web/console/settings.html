#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#top{display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--line);min-height:57px}

#crumb a{color:var(--sub);cursor:pointer;text-decoration:none}#crumb a:hover{color:var(--text)}
#crumb b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis}#crumb i{color:var(--faint);font-style:normal}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);padding:0;flex:none}

#back{display:none}
#body{flex:1;overflow-y:auto;padding:20px 24px 110px}

.ch+.row,.card>.row:first-child{border-top:0}
.rl{flex:1;min-width:0}.rt{font-weight:500;overflow-wrap:anywhere}.rh{color:var(--sub);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere;white-space:pre-line}
.rc{flex:none;display:flex;align-items:center;gap:8px;max-width:58%}
.row.col{flex-direction:column;align-items:stretch;gap:8px}.row.col .rc{max-width:none}
.row.act{cursor:pointer}.row.act:hover{background:var(--hover)}
.row.dng .rt{color:var(--danger)}.row.pri .rt{color:var(--acc)}
.row.dis{opacity:.5;pointer-events:none}
.val{color:var(--sub);text-align:right;overflow-wrap:anywhere}
.chev{color:var(--faint);font-size:18px;line-height:1}
.mod{box-shadow:inset 3px 0 0 var(--acc)}

.row.col input.tx{width:100%}

#bar{position:absolute;left:50%;bottom:20px;transform:translate(-50%,160%);transition:transform .2s;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--pop);border-radius:12px;padding:8px 8px 8px 16px;width:min(560px,calc(100% - 32px))}
#bar.on{transform:translate(-50%,0)}#bar span{flex:1;color:var(--sub)}
#load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 55%,transparent);z-index:5}
#load.on{display:flex}

.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;box-shadow:var(--pop);padding:10px 14px;white-space:pre-line;font-size:13px;animation:tin .2s}
.toast.err{border-left-color:var(--danger)}.toast.wrn{border-left-color:var(--warn)}@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
@media(max-width:760px){#side{width:100%;border:0}#app.in #side{display:none}#app:not(.in) #main{display:none}#back{display:inline-flex}
#top,#body{padding-left:14px;padding-right:14px}.row{padding:12px 14px;flex-wrap:wrap}.rc{max-width:100%}input.tx,select{width:100%}.rc:has(input.tx,select){width:100%}}
