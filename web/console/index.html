<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wadamesh</title>
<style>
/*#include theme.css*/
html,body{height:100%;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:16px;padding:0 16px;height:52px;flex:none;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#2c6bcf));box-shadow:inset 0 0 0 5px var(--bg2),0 0 0 1px var(--acc)}
nav{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;margin-left:auto}
nav button{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--sub);font-size:13.5px;font-weight:500;padding:6px 12px;border-radius:7px;white-space:nowrap}
nav button:hover{color:var(--text)}nav button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
nav button[hidden]{display:none}
nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#theme{flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--sub);padding:0}
#theme:hover{color:var(--text)}#theme svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#views{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}iframe.on{display:block}
#msg{padding:80px 24px;color:var(--sub);text-align:center}
@media(max-width:600px){header{gap:8px;padding:0 8px}.brand span{display:none}nav{margin-left:0;flex:1}nav button{flex:1;justify-content:center;padding:6px 6px}nav button b{display:none}}
</style>
<script>/*#include theme.js*/</script></head>
<body><div id="app">
<header><div class="brand"><i></i><span>wadamesh</span></div>
<nav>
<button data-v="dashboard" hidden title="Dashboard"><svg viewBox="0 0 24 24"><rect x=3 y=3 width=7 height=9 rx=1.5 /><rect x=14 y=3 width=7 height=5 rx=1.5 /><rect x=14 y=12 width=7 height=9 rx=1.5 /><rect x=3 y=16 width=7 height=5 rx=1.5 /></svg><b>Dashboard</b></button>
<button data-v="mesh" hidden title="Mesh"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><b>Mesh</b></button>
<button data-v="screen" hidden title="Screen"><svg viewBox="0 0 24 24"><rect x=3 y=4 width=18 height=13 rx=2 /><path d="M8 21h8M12 17v4"/></svg><b>Screen</b></button>
<button data-v="files" hidden title="Files"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><b>Files</b></button>
<button data-v="settings" hidden title="Settings"><svg viewBox="0 0 24 24"><circle cx=12 cy=12 r=3 /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><b>Settings</b></button>
</nav>
<button id="theme"></button></header>
<div id="views"><div id="msg">Connecting…</div></div>
</div>
<script>
// One page for every browser tool. Each tab is its own app in a same-origin frame; they
// share the browser id, so approving this browser once on the device unlocks every tab.
// The screen tab only exists while shown (its socket makes the device stream frames);
// the others stay loaded so a chat, a transfer or unsaved settings survive a tab switch.
var frames={},cur=null,KEEP={mesh:1,files:1,settings:1},tabs=document.querySelectorAll('nav button');
function show(n){
  if(cur&&cur!==n&&frames[cur]&&!KEEP[cur]){frames[cur].remove();delete frames[cur];}
  if(cur&&frames[cur])frames[cur].classList.remove('on');
  cur=n;
  if(!frames[n]){var f=document.createElement('iframe');f.src='/'+n;f.title=n;document.getElementById('views').appendChild(f);frames[n]=f;}
  frames[n].classList.add('on');
  tabs.forEach(function(b){b.classList.toggle('on',b.dataset.v===n);});
  try{history.replaceState(null,'','#'+n);}catch(e){}
}
tabs.forEach(function(b){b.onclick=function(){show(b.dataset.v);};});
// Theme button cycles Auto (follow the OS) -> Light -> Dark; the choice is kept per browser.
var THEMES={auto:['Auto','<circle cx=12 cy=12 r=9 /><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>'],
light:['Light','<circle cx=12 cy=12 r=4 /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'],
dark:['Dark','<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>']},themeBtn=document.getElementById('theme');
function themeNow(){var t=document.documentElement.getAttribute('data-theme');return THEMES[t]?t:'auto';}
function themeDraw(){var t=themeNow();themeBtn.innerHTML='<svg viewBox="0 0 24 24">'+THEMES[t][1]+'</svg>';themeBtn.title='Theme: '+THEMES[t][0];themeBtn.setAttribute('aria-label',themeBtn.title);}
themeBtn.onclick=function(){var t={auto:'light',light:'dark',dark:'auto'}[themeNow()];
  try{if(t==='auto')localStorage.removeItem(WT);else localStorage.setItem(WT,t);}catch(e){}
  wTheme(t);themeDraw();
  for(var n in frames)try{frames[n].contentWindow.wTheme(t);}catch(e){}};
addEventListener('storage',function(e){if(e.key===WT)themeDraw();});
themeDraw();
fetch('/api/info',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
  var first=null,want=location.hash.slice(1);
  tabs.forEach(function(b){if(j[b.dataset.v]){b.hidden=false;if(!first)first=b.dataset.v;}});
  if(!first){document.getElementById('msg').textContent='The web console is off on the device.';return;}
  document.getElementById('msg').remove();
  show(j[want]?want:first);
}).catch(function(){document.getElementById('msg').textContent='Could not reach the device.';});
</script></body></html>
