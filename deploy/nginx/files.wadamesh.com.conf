# files.wadamesh.com: the USB Files page (deploy/files/). A browser talks to the
# device's USB Files app over the cable with Web Serial; nothing a user does on the
# page reaches this server, it only serves the one static page.
#
# Cloudflare fronts it, SSL "Flexible" => CF<->origin is HTTP, so listen 80. The
# page upgrades http->https itself (Web Serial needs a secure context).
#
# Deploy:
#   Cloudflare: add files.wadamesh.com (proxied, orange cloud) pointing at the VPS.
#   sudo mkdir -p /srv/wadamesh/files
#   sudo cp deploy/nginx/files.wadamesh.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/files.wadamesh.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   WADAMESH_VPS=user@host scripts/deploy-files.sh

server {
    listen 80;
    listen [::]:80;
    server_name files.wadamesh.com;

    root /srv/wadamesh/files;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # The page is the whole app: keep it fresh so a fix reaches people quickly.
        add_header Cache-Control "public, max-age=300";
    }
}
