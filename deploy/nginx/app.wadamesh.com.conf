# app.wadamesh.com: the WADAMESH web client (web/ in this repo, built by web/build.sh).
#
# Two names, the same files:
#   https://app.wadamesh.com  full client: USB (Web Serial), Bluetooth, location.
#                             Cloudflare-proxied (SSL "Flexible"), so it reaches this
#                             origin on port 80.
#   http://wifi.app.wadamesh.com  the Wi-Fi version: a node's plain ws:// is mixed
#                             content from https. Proxied like the rest, but two levels
#                             deep, which Cloudflare's Universal SSL (apex + *.wadamesh.com)
#                             does not cover, so https to it fails. That matters: Chrome
#                             upgrades any http:// URL to https when the name answers
#                             https, so http://app.wadamesh.com bounces straight back to
#                             the https copy; a failed https makes Chrome stay on http.
#                             Keep Cloudflare's "Always Use HTTPS" OFF for the zone.
# The page picks its bundle itself: crossOriginIsolated (https) -> the pthreads build
# in /, otherwise the no-threads build in /nt/ (plain http is not a secure context, so
# COOP/COEP cannot enable SharedArrayBuffer there).
#
# Every response carries COOP/COEP/CORP: the threaded build needs a cross-origin
# isolated page. nginx replaces outer add_header sets inside a location that has its
# own, so each location repeats them ("always" keeps them on 304/404 too).
#
# Map tiles and the app Store are same-origin paths here (no CORS needed, COEP happy):
# they are handed to the tiles / firmware vhosts on this same box over loopback, so
# their rules, caches and allow-lists apply unchanged and nothing goes back out
# through Cloudflare.

server {
    listen 80;
    listen [::]:80;
    server_name app.wadamesh.com wifi.app.wadamesh.com;

    root /srv/wadamesh/app;
    index index.html;

    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;

    gzip_static on;

    # The page and the manifest: always revalidate, so a release shows at once.
    location / {
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
        add_header Cache-Control "no-cache" always;
    }

    # Bundles are requested with ?v=<build hash>: cache them for good.
    location ~* \.(wasm|js|css|png|svg|ico|webmanifest)$ {
        types {
            application/wasm wasm;
            text/javascript js;
            text/css css;
            image/png png;
            image/svg+xml svg;
            image/x-icon ico;
            application/manifest+json webmanifest;
        }
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Map tiles: only z/x/y tiles (optionally a style folder) and the elevation query,
    # handed to the tiles.wadamesh.com vhost on this box.
    location ^~ /tiles/ {
        location ~ "^/tiles/((?:[a-z]+/)?[0-9]{1,2}/[0-9]{1,7}/[0-9]{1,7}\.(?:jpg|png)|elev)$" {
            rewrite ^/tiles/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:80;
            proxy_set_header Host tiles.wadamesh.com;
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=1209600" always;
        }
        return 404;
    }

    # The app Store: the catalogs, versioned app folders and language files only (the
    # update check, OTA images and reports on that vhost stay unreachable from here).
    location ^~ /fw/apps/ {
        location ~ "^/fw/apps/(apps\.json|langs\.json|[A-Za-z0-9_-]{1,20}/[0-9][0-9.]{0,7}/[A-Za-z0-9_-][A-Za-z0-9._-]{0,39}|lang/([0-9][0-9.]{0,7}/)?[a-z]{2}(-[a-z]{2})?\.lang)$" {
            rewrite ^/fw/(apps/.*)$ /$1 break;
            proxy_pass http://127.0.0.1:80;
            proxy_set_header Host firmware.wadamesh.com;
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }
        return 404;
    }
}
